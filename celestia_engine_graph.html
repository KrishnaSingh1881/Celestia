<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celestia — Dynamic Causal Engine Health Graph</title>
<style>
:root{
  --black:#000;--panel:#242424;--card:#2c2c2c;--line:#3a3a3a;--line2:#4a4a4a;
  --t:#fff;--m:#CDCDCD;--dim:#8F8F8F;--pink:#F077AF;
  --ev:#6AA9FF;--cmp:#F077AF;--art:#B58CFF;--sen:#FFC46B;--st:#5FD3C4;--rk:#FF6B6B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:20;background:#000;font-size:13px}
.brand{display:flex;gap:10px;align-items:center;font-weight:600;letter-spacing:.01em}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--pink),#7a3d5c);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand span{color:var(--dim);font-weight:400}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:#2e2e2e;border:1px solid #545454;color:#fff;border-radius:8px;padding:6px 11px;font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#3d3d3d}
.btn.on{background:#4a2a3b;border-color:var(--pink);color:#fff}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#1a0a12;font-weight:600}

.layout{display:grid;grid-template-columns:232px minmax(0,1fr) 320px;min-height:calc(100vh - 54px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 11px}
.right{background:var(--panel);border-left:1px solid var(--line);padding:14px 12px}
.label{color:var(--dim);font-size:10px;letter-spacing:.06em;margin:14px 8px 7px}
.label:first-child{margin-top:2px}
.nav{display:block;width:100%;border:0;background:transparent;color:var(--m);text-align:left;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer;border-left:2px solid transparent}
.nav:hover{background:#383838;color:#fff}
.nav.active{background:#414141;color:#fff;border-left:2px solid var(--pink)}
.nav small{display:block;color:var(--dim);font-size:10px;margin-top:2px}

main{width:100%;padding:20px 22px 56px;min-width:0}
.eyebrow{color:var(--dim);font-size:11px}
h1{font-size:25px;line-height:31px;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 0 10px;font-weight:600}
.lead{font-size:13px;line-height:21px;color:var(--m);max-width:78ch;margin:0}

.pipe{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:14px 0 12px}
.stage{background:#2b2b2b;border:1px solid #4b4b4b;border-radius:7px;padding:5px 9px;font-size:10.5px;color:var(--m);transition:background .2s,color .2s,border-color .2s}
.stage.on{background:#4a2a3b;border-color:var(--pink);color:#fff}
.arrow{color:#6a6a6a;font-size:11px}

.graph{height:660px;background:#131313;border:1px solid var(--line2);border-radius:12px;overflow:hidden;position:relative}
.ghead{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:3;font-size:10px;color:var(--m);pointer-events:none}
.gtag{background:#000c;border:1px solid #3a3a3a;padding:4px 8px;border-radius:7px}
.legend{position:absolute;bottom:10px;left:12px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;background:#000c;border:1px solid #3a3a3a;padding:6px 9px;border-radius:8px;font-size:9.5px;color:var(--m)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend em{font-style:normal;color:var(--dim)}
svg.g{width:100%;height:100%;display:block}

.edge{fill:none;stroke:#585858;stroke-width:1.4;stroke-linecap:round}
.e-learned{stroke-dasharray:5 4;stroke:#7d7d7d}
.e-confirmed{stroke:#5FD3C4}
.edge.hot{stroke:var(--pink);stroke-width:2.6}
.edge.live{stroke:var(--pink);stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
.edge.live.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-28}}
.hideLearned .e-learned{display:none}
.chead{fill:var(--dim);font-size:10.5px;letter-spacing:.05em}
.node{cursor:pointer}
.node rect.box{fill:#2c2c2c;stroke:#5a5a5a;stroke-width:1.4;transition:fill .18s}
.node:hover rect.box{stroke:#9a9a9a}
.node.sel rect.box{stroke:#fff;stroke-width:2.2}
.node.hi rect.box{fill:#3b2530}
.node.off{opacity:.34}
.nt{fill:#fff;font-size:12px;font-weight:600}
.ns{fill:#a9a9a9;font-size:9.5px}
.np{font-size:11px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.crit{display:none}
.showCrit .crit{display:block}
.elabel{fill:#8a8a8a;font-size:9px;display:none}
.showEdgeLabels .elabel,.elabel.hot{display:block}
.elabel.hot{fill:#F077AF}

.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:11px;margin-bottom:10px}
.card.focus{border-color:var(--pink)}
.ct{font-size:10px;color:var(--dim);letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between}
.small{font-size:10.5px;line-height:16px;color:var(--dim)}
.metric{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #3d3d3d;font-size:11px;color:var(--m)}
.metric:last-child{border:0}
.metric b{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#fff;font-weight:600}
.bar{height:5px;background:#414141;border-radius:99px;overflow:hidden;margin:5px 0 2px}
.fill{height:100%;background:var(--pink);transition:width .18s}
.rank{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:11px;color:var(--m)}
.rank .n{width:16px;color:var(--dim);font-family:ui-monospace,monospace;font-size:10px}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{font-family:ui-monospace,monospace;font-size:10.5px;color:#fff}
.rank .b{width:54px;height:4px;background:#414141;border-radius:99px;overflow:hidden}
.rank .b i{display:block;height:100%;background:var(--pink)}
.rank.top .nm{color:#fff;font-weight:600}

.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range{flex:1;min-width:180px;accent-color:var(--pink)}
.tval{font-family:ui-monospace,monospace;font-size:11px;color:var(--m);background:#2b2b2b;border:1px solid #4b4b4b;border-radius:99px;padding:4px 9px}
.trace{width:100%;height:132px;background:#1c1c1c;border:1px solid #444;border-radius:9px;margin-top:9px;display:block}

table{width:100%;border-collapse:collapse;font-size:10.5px;background:var(--card);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
th,td{padding:7px 9px;border-bottom:1px solid #3d3d3d;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:10px}
td{color:var(--m)}
tr:last-child td{border-bottom:0}
tr.past td{color:#fff}
tr.now{background:#3a2530}
tr.future td{opacity:.42}

.caps{display:grid;grid-template-columns:1fr;gap:3px}
.cap{display:flex;gap:7px;align-items:center;font-size:10.5px;color:#6f6f6f;padding:3px 0;transition:color .2s}
.cap i{width:13px;height:13px;border-radius:4px;border:1px solid #555;display:grid;place-items:center;font-size:8px;flex:none}
.cap.on{color:#fff}
.cap.on i{background:var(--pink);border-color:var(--pink);color:#1a0a12}

.alarm{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #3d3d3d;font-size:10.5px;line-height:15px;color:var(--m)}
.alarm:last-child{border:0}
.sev{font-size:8.5px;padding:2px 5px;border-radius:5px;flex:none;margin-top:1px;letter-spacing:.03em}
.sev.info{background:#243b4d;color:#8ec5ff}
.sev.adv{background:#3d3a22;color:#e8d98a}
.sev.cau{background:#4a3520;color:#ffc46b}
.sev.wrn{background:#4d2020;color:#ff9a9a}
.alarm .tm{color:#7a7a7a;font-family:ui-monospace,monospace;font-size:9.5px}
.empty{font-size:10.5px;color:#6f6f6f;padding:6px 0}

.k2row{display:flex;gap:7px;font-size:10px;padding:4px 0;border-bottom:1px solid #3a3a3a;color:var(--m);align-items:baseline}
.k2row:last-child{border:0}
.k2row .vd{font-size:8.5px;padding:1px 5px;border-radius:4px;flex:none}
.vd.acc{background:#20402f;color:#7fe0a8}
.vd.rej{background:#3d2424;color:#ff9a9a}
.vd.chk{background:#32304a;color:#b9b0ff}
.k2row code{font-family:ui-monospace,monospace;font-size:9.5px;color:#cfcfcf}

.vic{padding:6px 0;border-bottom:1px solid #3d3d3d;font-size:10.5px;color:var(--m)}
.vic:last-child{border:0}
.vic .hd{display:flex;justify-content:space-between;gap:8px;color:#fff;font-size:11px}
.vic .mt{color:var(--dim);font-size:9.5px;margin-top:2px}
.vic .tag{font-size:8.5px;padding:1px 5px;border-radius:4px;background:#333;color:#bdbdbd;margin-right:4px}
.vic.armed .hd{color:var(--pink)}

@media(max-width:1180px){.layout{grid-template-columns:210px minmax(0,1fr)}.right{display:none}}
@media(max-width:820px){.layout{display:block}.side{display:none}main{padding:16px 13px 40px}.graph{height:440px}}
@media(prefers-reduced-motion:reduce){.edge.live{animation:none}}
</style></head>

const sc=()=>SCENARIOS[S.scen];

function val(id){
 const cv=sc().curves[id]; if(!cv) return .05;
 const L=(t,m,k)=>1/(1+Math.exp(-(t-m)/k));
 if(cv.m1!==undefined) return cv.b+(cv.p-cv.b)*L(S.t,cv.m1,cv.k1)*(1-L(S.t,cv.m2,cv.k2));
 return cv.b+(cv.p-cv.b)*L(S.t,cv.m,cv.k);
}
function shown(n){return n.invert?val(n.id):val(n.id)}
function active(id){const n=byId[id];return n.invert?val(id)<.85:val(id)>.45}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function attention(a,b){ // GAT-style attention weight, context dependent
 const va=val(a),vb=val(b);
 return Math.max(.08,Math.min(.99,.15+.85*(va*.65+vb*.35)));
}

  if(!active(n.id)&&v<.12&&S.t>50) cls.push("off");
  e.g.setAttribute("class",cls.join(" "));
 });

 // edges
 gEls.edges.forEach(o=>{
  const [a,b,rel,prov]=o.e;
  const touch=(a===S.sel||b===S.sel);
  const flowing=active(a)&&val(b)>.3&&S.mode!=="structure";
  const back=S.mode==="diagnosis"&&rel==="evidence";
  const cls=["edge","e-"+prov];
  if(flowing) cls.push("live");
  if(back&&flowing) cls.push("rev");
  if(touch) cls.push("hot");
  o.path.setAttribute("class",cls.join(" "));
  const w=S.attention?(1+attention(a,b)*4.2):(touch?2.6:flowing?2.2:1.4);
  o.path.style.strokeWidth=w.toFixed(2)+"px";
  o.path.setAttribute("marker-end",(flowing||touch)?"url(#arp)":"url(#ar)");
  o.label.setAttribute("class","elabel"+(touch?" hot":""));
 });
 gEls.temporal.forEach(o=>{
  const on=active(o.id)&&S.t>60;

 document.getElementById("gtag2").textContent={structure:"Structure view",diagnosis:"Backward — root cause",prognosis:"Forward — next victims",replay:"Replay"}[S.mode];

 panels();
}

  att.map(x=>`<div class="rank"><span class="nm">${esc(byId[x.e[0]].t)} → ${esc(byId[x.e[1]].t)}</span>
   <span class="b"><i style="width:${x.a*100}%"></i></span><span class="v">${x.a.toFixed(2)}</span></div>`).join("")+
  `<div class="small" style="margin-top:6px">Weights are context-dependent: the same structural edge carries different
   influence at idle, at cruise and under this fault.</div>`;

 // focus card by mode
 ["c_rank","c_vic","c_att"].forEach(id=>document.getElementById(id).classList.remove("focus"));
 const f={diagnosis:"c_rank",prognosis:"c_vic",structure:"c_att"}[S.mode];
 if(f) document.getElementById(f).classList.add("focus");

 // table
 document.getElementById("tbl").innerHTML=scn.table.map((r,i)=>{
  const at=i*20,cls=t>=at+20?"past":t>=at?"now":"future";
  return `<tr class="${cls}"><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`;
 }).join("");

 trace();
}

/* trace chart */
function trace(){
 const W=900,H=132,keys=[["ev_res","#6AA9FF","physics residual"],[scenLead(),"#F077AF","leading hypothesis"],["rk_msn","#5FD3C4","mission survival"]];
 const save=S.t;
 const line=(id)=>{let d="";for(let i=0;i<=W;i+=6){S.t=i/W*100;const v=val(id);const y=H-12-v*(H-30);d+=(i?"L":"M")+i+" "+y.toFixed(1)}return d};
 let out=`<g stroke="#3a3a3a" stroke-width="1">${[30,60,90,120].map(y=>`<path d="M0 ${y}H${W}"/>`).join("")}</g>`;
 keys.forEach(([id,col])=>{out+=`<path d="${line(id)}" fill="none" stroke="${col}" stroke-width="2"/>`});
 S.t=save;
 const cx=S.t/100*W;
 out+=`<path d="M${cx} 0V${H}" stroke="#F077AF" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
 keys.forEach(([id,col,lbl],i)=>{
  out+=`<g transform="translate(${12+i*210},16)"><rect width="9" height="3" y="-3" rx="1.5" fill="${col}"/>
   <text x="14" y="0" fill="#a9a9a9" font-size="10">${lbl}</text></g>`;
 });
 document.getElementById("trace").innerHTML=out;
}
function scenLead(){return {A:"rc_inj",B:"rc_art",C:"rc_cool"}[S.scen]}

/* ─────────────────────────  K2 ANIMATION  ───────────────────────── */
function runK2(){
 if(S.k2run) return;
 S.k2run=true;S.k2=[];S.learned=true;
 let bic=-4182;
 document.getElementById("k2sum").textContent="Searching parent sets in topological order…";
 K2STEPS.forEach((st,i)=>setTimeout(()=>{
  S.k2.push(st);
  if(st.v==="acc") bic-=parseInt(st.d.replace(/[^0-9]/g,""),10);
  document.getElementById("bic").textContent="BIC "+bic;
  document.getElementById("k2list").innerHTML=S.k2.map(x=>
   `<div class="k2row"><span class="vd ${x.v}">${x.v==="acc"?"ACCEPT":x.v==="rej"?"REJECT":"CONFIRM"}</span>
    <span style="flex:1">${esc(x.e)}<br><span class="small">${esc(x.n)}</span></span>
    <code>${x.d}</code></div>`).join("");
  if(i===K2STEPS.length-1){
   S.k2run=false;
   document.getElementById("k2sum").textContent="3 edges accepted · 2 rejected · 2 held for engineer confirmation";
   syncTogs();sync();
  }
 },420*(i+1)));
}

/* ─────────────────────────  CONTROLS  ───────────────────────── */
function syncTogs(){
 document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
 document.querySelectorAll("[data-tog]").forEach(b=>b.classList.toggle("active",S[b.dataset.tog]));
 document.querySelectorAll("[data-scen]").forEach(b=>b.classList.toggle("active",b.dataset.scen===S.scen));
 document.getElementById("play").textContent=S.playing?"Pause":"Run";
}
function play(on){
 S.playing=on;
 clearInterval(S.timer);S.timer=null;
 if(on){S.timer=setInterval(()=>{S.t=S.t>=100?100:S.t+0.6;if(S.t>=100)play(false);sync()},70)}
 syncTogs();
}
function bind(){
 document.getElementById("scenList").innerHTML=Object.entries(SCENARIOS).map(([k,v])=>
  `<button class="nav" data-scen="${k}">${esc(v.name)}<small>${esc(v.sub)}</small></button>`).join("");

 document.querySelectorAll("[data-scen]").forEach(b=>b.onclick=()=>{
  S.scen=b.dataset.scen;S.t=0;S.lastAlarms=-1;S.sel=scenLead();play(false);sync()});
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;syncTogs();sync()});
 document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{S[b.dataset.tog]=!S[b.dataset.tog];syncTogs();sync()});
 document.getElementById("play").onclick=()=>play(!S.playing);
 document.getElementById("restart").onclick=()=>{S.t=0;S.lastAlarms=-1;play(true);sync()};
 document.getElementById("pause").onclick=()=>play(false);
 document.getElementById("slider").oninput=e=>{play(false);S.t=+e.target.value;S.lastAlarms=-1;sync()};
 document.getElementById("runk2").onclick=runK2;
 document.addEventListener("keydown",e=>{
  if(e.key===" "&&e.target.tagName!=="INPUT"){e.preventDefault();play(!S.playing)}
 });
}

document.getElementById("root").innerHTML=shell();
buildGraph();bind();syncTogs();sync();
})();
</script></body></html>
